name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ============================================
  # 代码检查
  # ============================================
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.11.26"

      - name: Ruff lint
        run: uvx --from ruff==0.11.13 ruff check . --output-format=github

      - name: Ruff format check
        run: uvx --from ruff==0.11.13 ruff format --check .

  # ============================================
  # 标准库语法编译检查，不执行应用导入或安装业务依赖
  # ============================================
  syntax:
    name: Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.11.26"

      - name: Check syntax (compile all .py files)
        run: uv run --no-project --python 3.11 python -m compileall -q agent/ api/ tools/ utils/
