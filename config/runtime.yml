timeouts:
  total_seconds: 300.0
  request_seconds: 60.0
  shutdown_seconds: 5.0
  tool_seconds: 25.0
  # End acquisition at 210 seconds; final reporting gets up to 85 seconds plus 5 seconds for shutdown.
  report_reserve_seconds: 90.0
stages:
  # Minimum admission windows, not predictions of provider latency. All actual deadlines are hard bounds.
  coordination_seconds: 10.0
  expert_request_min_seconds: 10.0
  tool_min_seconds: 5.0
  handoff_seconds: 10.0
context:
  # Project request budget, measured over the complete UTF-8 JSON payload.
  # Text uses conservative UTF-8 bounds; inline images use verified per-image token bounds.
  # Base64 still counts toward the transport byte cap, not the text-token estimate.
  max_request_bytes: 2097152
  skill_metadata_bytes: 8000
  safety_tokens: 8192
  # Alibaba Cloud model cards, verified 2026-10-26. Values are tokens, not K/M abbreviations.
  # https://help.aliyun.com/zh/model-studio/qwen3-8-max
  # https://help.aliyun.com/zh/model-studio/qwen3-8-flash
  # Image bound: 16384 visual tokens + 2 image delimiters (verified 2026-11-13).
  # https://help.aliyun.com/zh/model-studio/vision
  models:
    qwen3.8-max:
      window_tokens: 1000000
      max_input_tokens: 991808
      max_thinking_input_tokens: 983616
      max_output_tokens: 131072
      max_thinking_tokens: 262144
      max_image_tokens: 16386
    qwen3.8-flash:
      window_tokens: 1000000
      max_input_tokens: 991808
      max_thinking_input_tokens: 983616
      max_output_tokens: 131072
      max_thinking_tokens: 262144
      max_image_tokens: 16386
budgets:
  total: 80
  main_model: 20
  sub_model: 30
  tool: 40
  retry: 12
  tools_per_turn: 8
sql:
  # Empty by default. Add only actual business tables approved for querying.
  allowed_tables: []
  max_rows: 100
  timeout_seconds: 10
  max_query_chars: 12000
search:
  # Direct search and page-reading hard caps, counted by the runtime.
  calls_per_task: 2
  max_tasks_per_run: 8
  # Whole-run cap includes every provider attempt.
  calls_per_run: 12
  timeout_seconds: 20
  result_chars: 1000
  content_chars: 6000
  page_reads_per_task: 3
files:
  skill_directory: skills
  max_upload_bytes: 10485760
retry:
  max_retries: 1
  delay_seconds: 0.25
  max_delay_seconds: 20.0
  tools: [internet_search, read_web_page, list_sql_tables, get_table_data, execute_sql_query]

scheduler:
  # Identical model endpoint/key pairs share a pool automatically.
  # Map MAIN/SUB to the same account ID when one account has different API keys.
  model_accounts: {}
  runs: {concurrency: 2, queue_capacity: 16}
  children: {concurrency: 4, queue_capacity: 64}
  models: {concurrency: 2, queue_capacity: 32, requests_per_second: 2.0}
  search: {concurrency: 2, queue_capacity: 32, requests_per_second: 3.0}
